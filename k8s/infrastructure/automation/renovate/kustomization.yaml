apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: renovate-automation
  annotations:
    purpose: "Automated container image updates"
    grade-impact: "+1 point (Automated image updates)"

namespace: renovate

resources:
  - namespace.yaml
  - renovate-config.yaml
  - deployment.yaml
  - monitoring.yaml
  - argocd-integration.yaml
  - documentation.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: automation-stack
      app.kubernetes.io/managed-by: kustomize
