---
# OpenTelemetry Collector for auto-instrumentation
# This allows apps to send traces via OTLP protocol
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: tracing
  labels:
    app: otel-collector
data:
  otel-collector-config.yaml: |
    receivers:
      # OTLP receiver for gRPC
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      # Jaeger receiver (legacy)
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268
          thrift_compact:
            endpoint: 0.0.0.0:6831
          thrift_binary:
            endpoint: 0.0.0.0:6832

      # Zipkin receiver
      zipkin:
        endpoint: 0.0.0.0:9411

    processors:
      # Batch processor for performance
      batch:
        timeout: 1s
        send_batch_size: 1024

      # Memory limiter to prevent OOM
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

      # Add resource attributes
      resource:
        attributes:
          - key: cluster.name
            value: talos-homelab
            action: upsert

    exporters:
      # Export to Jaeger
      jaeger:
        endpoint: jaeger-collector:14250
        tls:
          insecure: true

      # Export metrics about traces
      prometheus:
        endpoint: "0.0.0.0:8888"

    service:
      pipelines:
        traces:
          receivers: [otlp, jaeger, zipkin]
          processors: [memory_limiter, batch, resource]
          exporters: [jaeger]

      telemetry:
        metrics:
          address: ":8888"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: tracing
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.95.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/otel-collector-config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: jaeger-grpc
              containerPort: 14250
              protocol: TCP
            - name: jaeger-thrift
              containerPort: 14268
              protocol: TCP
            - name: zipkin
              containerPort: 9411
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: tracing
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: jaeger-grpc
      port: 14250
      targetPort: jaeger-grpc
      protocol: TCP
    - name: jaeger-thrift
      port: 14268
      targetPort: jaeger-thrift
      protocol: TCP
    - name: zipkin
      port: 9411
      targetPort: zipkin
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: metrics
      protocol: TCP
  type: ClusterIP
---
# Example: Traefik integration
# Add this to Traefik deployment to enable tracing
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-tracing-config
  namespace: traefik
  labels:
    app: traefik
data:
  # Add to Traefik static configuration
  tracing.yaml: |
    tracing:
      serviceName: traefik
      spanNameLimit: 150
      jaeger:
        samplingType: const
        samplingParam: 1.0
        localAgentHostPort: jaeger-agent.tracing:6831
      # Or use OTLP
      otlp:
        grpc:
          endpoint: otel-collector.tracing:4317
          insecure: true
---
# Example: Application instrumentation template
# This shows how to configure an app to send traces
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-tracing-example
  namespace: production
  labels:
    purpose: documentation
data:
  README.md: |
    # Application Tracing Integration

    ## Environment Variables for OTLP Tracing

    Add these environment variables to your application deployment:

    ```yaml
    env:
      # OpenTelemetry Configuration
      - name: OTEL_TRACES_EXPORTER
        value: "otlp"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://otel-collector.tracing:4317"
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: "grpc"
      - name: OTEL_SERVICE_NAME
        value: "your-service-name"
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: "deployment.environment=production,service.version=1.0.0"

      # Jaeger Configuration (legacy, if not using OTLP)
      - name: JAEGER_AGENT_HOST
        value: "jaeger-agent.tracing"
      - name: JAEGER_AGENT_PORT
        value: "6831"
      - name: JAEGER_SAMPLER_TYPE
        value: "const"
      - name: JAEGER_SAMPLER_PARAM
        value: "1"
    ```

    ## Language-Specific Examples

    ### Python (using opentelemetry-api)
    ```python
    from opentelemetry import trace
    from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter
    from opentelemetry.sdk.trace import TracerProvider
    from opentelemetry.sdk.trace.export import BatchSpanProcessor

    provider = TracerProvider()
    processor = BatchSpanProcessor(OTLPSpanExporter())
    provider.add_span_processor(processor)
    trace.set_tracer_provider(provider)
    ```

    ### Node.js (using @opentelemetry/sdk-node)
    ```javascript
    const { NodeSDK } = require('@opentelemetry/sdk-node');
    const { OTLPTraceExporter } = require('@opentelemetry/exporter-trace-otlp-grpc');

    const sdk = new NodeSDK({
      traceExporter: new OTLPTraceExporter(),
      serviceName: 'your-service-name',
    });
    sdk.start();
    ```

    ### Go (using go.opentelemetry.io)
    ```go
    import (
        "go.opentelemetry.io/otel"
        "go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc"
        "go.opentelemetry.io/otel/sdk/trace"
    )

    exporter, _ := otlptracegrpc.New(context.Background())
    tp := trace.NewTracerProvider(trace.WithBatcher(exporter))
    otel.SetTracerProvider(tp)
    ```
