# Jaeger CRD - Custom Resource Definition
# This defines the Jaeger custom resource type
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jaegers.jaegertracing.io
spec:
  group: jaegertracing.io
  names:
    kind: Jaeger
    listKind: JaegerList
    plural: jaegers
    singular: jaeger
    shortNames:
      - jae
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                strategy:
                  type: string
                  enum:
                    - allInOne
                    - production
                    - streaming
                allInOne:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                agent:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                collector:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                query:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                ingester:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                storage:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                ingress:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                annotations:
                  type: object
                  additionalProperties:
                    type: string
                labels:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          description: Jaeger instance status
          jsonPath: .status.phase
        - name: Version
          type: string
          description: Jaeger version
          jsonPath: .status.version
        - name: Strategy
          type: string
          description: Deployment strategy
          jsonPath: .spec.strategy
        - name: Storage
          type: string
          description: Storage type
          jsonPath: .spec.storage.type
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
