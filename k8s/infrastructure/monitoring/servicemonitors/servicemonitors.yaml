---
# Generic application monitoring
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubernetes-pods
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      prometheus.io/scrape: "true"
  endpoints:
    - interval: 30s
      port: metrics
