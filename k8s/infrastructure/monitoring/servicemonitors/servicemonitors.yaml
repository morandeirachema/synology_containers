# ServiceMonitors for Prometheus Operator
# Automatically configure Prometheus to scrape service metrics

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: traefik
  labels:
    app: traefik
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: traefik
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scheme: http
