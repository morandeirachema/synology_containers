# Prometheus AlertRules for all services

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: infrastructure-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: traefik
      interval: 30s
      rules:
        - alert: TraefikDown
          expr: up{job="traefik"} == 0
          for: 5m
          labels:
            severity: critical
            component: ingress
          annotations:
            summary: "Traefik is down"
            description: "Traefik has been down for more than 5 minutes. All ingress traffic is affected."

        - alert: TraefikHighErrorRate
          expr: rate(traefik_backend_requests_total{code=~"5.."}[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
            component: ingress
          annotations:
            summary: "High 5xx error rate on Traefik"
            description: "Traefik is returning {{ $value | humanizePercentage }} 5xx errors."

        - alert: TraefikHighLatency
          expr: histogram_quantile(0.99, rate(traefik_backend_request_duration_seconds_bucket[5m])) > 3
          for: 5m
          labels:
            severity: warning
            component: ingress
          annotations:
            summary: "High latency on Traefik"
            description: "99th percentile latency is {{ $value }}s."

        - alert: TraefikTooFewReplicas
          expr: kube_deployment_status_replicas_available{deployment="traefik"} < 2
          for: 5m
          labels:
            severity: warning
            component: ingress
          annotations:
            summary: "Traefik running with less than 2 replicas"
            description: "Only {{ $value }} Traefik replicas available. HA is compromised."

    - name: authelia
      interval: 30s
      rules:
        - alert: AutheliaDown
          expr: up{job="authelia"} == 0
          for: 5m
          labels:
            severity: critical
            component: authentication
          annotations:
            summary: "Authelia is down"
            description: "Authelia SSO is down. Users cannot authenticate."

        - alert: AutheliaHighFailedLogins
          expr: rate(authelia_authentication_failed_total[5m]) > 5
          for: 5m
          labels:
            severity: warning
            component: authentication
          annotations:
            summary: "High number of failed login attempts"
            description: "{{ $value }} failed login attempts per second. Possible brute force attack."

        - alert: AutheliaPostgresConnectionFailed
          expr: authelia_postgres_connection_errors_total > 10
          for: 2m
          labels:
            severity: critical
            component: authentication
          annotations:
            summary: "Authelia cannot connect to PostgreSQL"
            description: "Authelia has {{ $value }} database connection errors."

        - alert: AutheliaRedisConnectionFailed
          expr: authelia_redis_connection_errors_total > 10
          for: 2m
          labels:
            severity: warning
            component: authentication
          annotations:
            summary: "Authelia cannot connect to Redis"
            description: "Session caching is degraded."

    - name: databases
      interval: 30s
      rules:
        - alert: PostgresDown
          expr: up{job=~".*-postgres"} == 0
          for: 2m
          labels:
            severity: critical
            component: database
          annotations:
            summary: "PostgreSQL instance is down"
            description: "{{ $labels.job }} has been down for more than 2 minutes."

        - alert: PostgresHighConnections
          expr: sum(pg_stat_activity_count) by (instance) > 80
          for: 5m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "High number of PostgreSQL connections"
            description: "{{ $value }} connections on {{ $labels.instance }}."

        - alert: PostgresReplicationLag
          expr: pg_replication_lag > 30
          for: 5m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "PostgreSQL replication lag detected"
            description: "Replication lag is {{ $value }} seconds."

        - alert: RedisDown
          expr: up{job=~".*-redis"} == 0
          for: 2m
          labels:
            severity: warning
            component: cache
          annotations:
            summary: "Redis instance is down"
            description: "{{ $labels.job }} has been down for more than 2 minutes."

        - alert: RedisHighMemoryUsage
          expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
          for: 5m
          labels:
            severity: warning
            component: cache
          annotations:
            summary: "Redis memory usage is high"
            description: "Redis is using {{ $value | humanizePercentage }} of available memory."

    - name: applications
      interval: 30s
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) > 0.1
          for: 5m
          labels:
            severity: warning
            component: pod
          annotations:
            summary: "Pod is crash looping"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting frequently."

        - alert: PodNotReady
          expr: kube_pod_status_phase{phase!~"Running|Succeeded"} > 0
          for: 10m
          labels:
            severity: warning
            component: pod
          annotations:
            summary: "Pod is not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in {{ $labels.phase }} state for more than 10 minutes."

        - alert: DeploymentReplicasMismatch
          expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
          for: 10m
          labels:
            severity: warning
            component: deployment
          annotations:
            summary: "Deployment replicas mismatch"
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has {{ $value }} available replicas but {{ $labels.spec_replicas }} desired."

        - alert: StatefulSetReplicasMismatch
          expr: kube_statefulset_status_replicas_ready != kube_statefulset_status_replicas
          for: 10m
          labels:
            severity: warning
            component: statefulset
          annotations:
            summary: "StatefulSet replicas mismatch"
            description: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has only {{ $value }} ready replicas."

        - alert: PVCPendingTooLong
          expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} > 0
          for: 10m
          labels:
            severity: warning
            component: storage
          annotations:
            summary: "PVC pending for too long"
            description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has been pending for more than 10 minutes."

    - name: resources
      interval: 30s
      rules:
        - alert: NodeHighCPUUsage
          expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 90
          for: 15m
          labels:
            severity: warning
            component: node
          annotations:
            summary: "Node CPU usage is high"
            description: "Node {{ $labels.instance }} CPU usage is {{ $value }}%."

        - alert: NodeHighMemoryUsage
          expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
          for: 15m
          labels:
            severity: warning
            component: node
          annotations:
            summary: "Node memory usage is high"
            description: "Node {{ $labels.instance }} memory usage is {{ $value }}%."

        - alert: NodeDiskSpaceLow
          expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
          for: 5m
          labels:
            severity: warning
            component: node
          annotations:
            summary: "Node disk space is low"
            description: "Node {{ $labels.instance }} has only {{ $value }}% disk space available."

        - alert: NodeDiskSpaceCritical
          expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 5
          for: 2m
          labels:
            severity: critical
            component: node
          annotations:
            summary: "Node disk space is critically low"
            description: "Node {{ $labels.instance }} has only {{ $value }}% disk space available!"

    - name: certificates
      interval: 60s
      rules:
        - alert: CertificateExpiringSoon
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < (7 * 24 * 3600)
          for: 1h
          labels:
            severity: warning
            component: certificates
          annotations:
            summary: "Certificate expiring soon"
            description: "Certificate {{ $labels.name }} in {{ $labels.namespace }} expires in {{ $value | humanizeDuration }}."

        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{condition="False"} > 0
          for: 10m
          labels:
            severity: warning
            component: certificates
          annotations:
            summary: "Certificate not ready"
            description: "Certificate {{ $labels.name }} in {{ $labels.namespace }} is not ready."
