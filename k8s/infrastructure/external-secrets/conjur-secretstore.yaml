---
# Conjur credentials secret
# This secret contains the Conjur admin credentials
# Replace the apikey with the one generated during Conjur initialization
apiVersion: v1
kind: Secret
metadata:
  name: conjur-creds
  namespace: default
type: Opaque
stringData:
  username: admin
  apikey: REPLACE_WITH_CONJUR_API_KEY  # Get this from: kubectl exec -n conjur $CONJUR_POD -- conjurctl account create default

---
# SecretStore for Conjur
# This defines how External Secrets Operator connects to Conjur
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: conjur
  namespace: default
  labels:
    app: external-secrets
    backend: conjur
spec:
  provider:
    conjur:
      url: http://conjur-oss.conjur.svc.cluster.local
      auth:
        apikey:
          account: default
          userRef:
            name: conjur-creds
            key: username
          apiKeyRef:
            name: conjur-creds
            key: apikey

---
# ClusterSecretStore (optional - for cluster-wide access)
# Use this if you want to access Conjur secrets from any namespace
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: conjur-cluster
  labels:
    app: external-secrets
    backend: conjur
spec:
  provider:
    conjur:
      url: http://conjur-oss.conjur.svc.cluster.local
      auth:
        apikey:
          account: default
          userRef:
            name: conjur-creds
            namespace: default
            key: username
          apiKeyRef:
            name: conjur-creds
            namespace: default
            key: apikey
