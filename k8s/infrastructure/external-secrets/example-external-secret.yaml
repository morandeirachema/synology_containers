---
# Example: ExternalSecret for database credentials
# This demonstrates how to sync secrets from Conjur to Kubernetes

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: default
  labels:
    app: example
    type: database
spec:
  # Refresh interval - how often to check for secret updates
  refreshInterval: 1h

  # Reference to the SecretStore
  secretStoreRef:
    name: conjur
    kind: SecretStore

  # Target Kubernetes secret
  target:
    name: database-credentials
    creationPolicy: Owner  # ESO owns and manages this secret
    template:
      type: Opaque
      metadata:
        labels:
          app: example
          managed-by: external-secrets

  # Data to sync from Conjur
  data:
    - secretKey: username  # Key in the Kubernetes secret
      remoteRef:
        key: k8s-secrets/database/username  # Path in Conjur

    - secretKey: password
      remoteRef:
        key: k8s-secrets/database/password

    - secretKey: host
      remoteRef:
        key: k8s-secrets/database/host

    - secretKey: port
      remoteRef:
        key: k8s-secrets/database/port

---
# Example: ExternalSecret for API tokens
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-tokens
  namespace: default
  labels:
    app: example
    type: api
spec:
  refreshInterval: 30m

  secretStoreRef:
    name: conjur
    kind: SecretStore

  target:
    name: api-tokens
    creationPolicy: Owner

  data:
    - secretKey: github-token
      remoteRef:
        key: k8s-secrets/api/github-token

    - secretKey: docker-registry-token
      remoteRef:
        key: k8s-secrets/api/docker-registry-token

---
# Example: ExternalSecret with templating
# This creates a complete connection string from multiple Conjur variables
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-connection
  namespace: default
  labels:
    app: example
    type: connection-string
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: conjur
    kind: SecretStore

  target:
    name: postgres-connection
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Template to create a connection string
        connection-string: |
          postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .database }}

        # Individual values also available
        username: "{{ .username }}"
        password: "{{ .password }}"

  data:
    - secretKey: username
      remoteRef:
        key: k8s-secrets/postgres/username

    - secretKey: password
      remoteRef:
        key: k8s-secrets/postgres/password

    - secretKey: host
      remoteRef:
        key: k8s-secrets/postgres/host

    - secretKey: port
      remoteRef:
        key: k8s-secrets/postgres/port

    - secretKey: database
      remoteRef:
        key: k8s-secrets/postgres/database

---
# Example: ExternalSecret for TLS certificates
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tls-certificates
  namespace: default
  labels:
    app: example
    type: tls
spec:
  refreshInterval: 24h

  secretStoreRef:
    name: conjur
    kind: SecretStore

  target:
    name: tls-certificates
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls  # Standard TLS secret type

  data:
    - secretKey: tls.crt
      remoteRef:
        key: k8s-secrets/tls/certificate

    - secretKey: tls.key
      remoteRef:
        key: k8s-secrets/tls/private-key

---
# Example: Using the secret in a Pod
apiVersion: v1
kind: Pod
metadata:
  name: example-app
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:alpine
      env:
        # Environment variables from the secret
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: username

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: password

        # Using the connection string
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-connection
              key: connection-string

      # Or mount as files
      volumeMounts:
        - name: api-tokens
          mountPath: /etc/secrets
          readOnly: true

  volumes:
    - name: api-tokens
      secret:
        secretName: api-tokens
        defaultMode: 0400  # Read-only for owner
