---
# ServiceAccount for DR testing
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dr-tester
  namespace: dr-testing
---
# ClusterRole for DR testing operations
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dr-tester
rules:
  # Velero backup/restore operations
  - apiGroups:
      - velero.io
    resources:
      - backups
      - restores
      - schedules
      - backupstoragelocations
      - volumesnapshotlocations
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Access to test namespace resources
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - services
      - persistentvolumeclaims
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Read-only access to production for validation
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
    resourceNames: []

  # Metrics access
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dr-tester
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dr-tester
subjects:
  - kind: ServiceAccount
    name: dr-tester
    namespace: dr-testing
