apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: disaster-recovery-testing
  annotations:
    purpose: "Automated quarterly DR testing"
    grade-impact: "+1 point (Automated DR testing)"

namespace: dr-testing

resources:
  - namespace.yaml
  - rbac.yaml
  - dr-test-runner.yaml
  - quarterly-schedule.yaml
  - manual-test-job.yaml
  - monitoring.yaml
  - documentation.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: resilience-stack
      app.kubernetes.io/managed-by: kustomize
