# PVC for storing DR test reports
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dr-test-reports
  namespace: dr-testing
  labels:
    app: dr-tester
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
