---
# ConfigMap with RTO/RPO targets and documentation
apiVersion: v1
kind: ConfigMap
metadata:
  name: rto-rpo-targets
  namespace: velero
data:
  targets.yaml: |
    # Recovery Time Objective (RTO) and Recovery Point Objective (RPO) Targets

    services:
      # Critical Services - Tier 1
      - name: traefik
        tier: critical
        rto: 15 minutes
        rpo: 1 hour
        justification: "Ingress controller - all services depend on it"

      - name: authelia
        tier: critical
        rto: 15 minutes
        rpo: 1 hour
        justification: "Authentication service - security critical"

      - name: postgres
        tier: critical
        rto: 20 minutes
        rpo: 6 hours
        justification: "Database - application state storage"

      - name: redis
        tier: critical
        rto: 15 minutes
        rpo: 6 hours
        justification: "Cache and session storage"

      # Important Services - Tier 2
      - name: vaultwarden
        tier: important
        rto: 30 minutes
        rpo: 6 hours
        justification: "Password manager - high value data"

      - name: nextcloud
        tier: important
        rto: 60 minutes
        rpo: 24 hours
        justification: "File storage - large data volumes"

      # Standard Services - Tier 3
      - name: homepage
        tier: standard
        rto: 60 minutes
        rpo: 24 hours
        justification: "Dashboard - non-critical"

      - name: it-tools
        tier: standard
        rto: 60 minutes
        rpo: 24 hours
        justification: "Developer tools - stateless"

    backup_schedules:
      - name: database-backup
        frequency: "Every 6 hours"
        rpo_coverage: "6 hours"
        retention: "14 days"

      - name: hourly-config-backup
        frequency: "Every hour"
        rpo_coverage: "1 hour"
        retention: "7 days"

      - name: daily-full-backup
        frequency: "Daily"
        rpo_coverage: "24 hours"
        retention: "30 days"

      - name: weekly-monitoring-backup
        frequency: "Weekly"
        rpo_coverage: "7 days"
        retention: "90 days"

---
# PrometheusRule for RTO/RPO monitoring
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rto-rpo-monitoring
  namespace: velero
  labels:
    prometheus: kube-prometheus
spec:
  groups:
    - name: rpo-compliance
      interval: 5m
      rules:
        # RPO Alerts - Backup freshness
        - alert: CriticalServiceBackupOld
          expr: (time() - velero_backup_last_successful_timestamp{schedule="database-backup"}) > 21600
          for: 10m
          labels:
            severity: critical
            component: disaster-recovery
            metric: rpo
          annotations:
            summary: "Critical service backup exceeds RPO target"
            description: "Last successful database backup was {{ $value | humanizeDuration }} ago. RPO target is 6 hours."
            runbook: "Check Velero backup status and logs. Ensure backup schedule is running."

        - alert: HourlyBackupMissed
          expr: (time() - velero_backup_last_successful_timestamp{schedule="hourly-config-backup"}) > 7200
          for: 15m
          labels:
            severity: warning
            component: disaster-recovery
            metric: rpo
          annotations:
            summary: "Hourly backup missed"
            description: "Last hourly backup was {{ $value | humanizeDuration }} ago. Expected every hour."

        - alert: DailyBackupMissed
          expr: (time() - velero_backup_last_successful_timestamp{schedule="daily-full-backup"}) > 108000
          for: 1h
          labels:
            severity: warning
            component: disaster-recovery
            metric: rpo
          annotations:
            summary: "Daily backup missed or late"
            description: "Last daily backup was {{ $value | humanizeDuration }} ago. Expected every 24 hours."

    - name: rto-compliance
      interval: 5m
      rules:
        # RTO Alerts - Restore performance
        - alert: RestoreExceedsRTO
          expr: velero_restore_duration_seconds > 1800
          for: 5m
          labels:
            severity: warning
            component: disaster-recovery
            metric: rto
          annotations:
            summary: "Restore operation exceeds RTO target"
            description: "Restore taking {{ $value | humanizeDuration }}. Target RTO for critical services is 30 minutes."

        - alert: RestorePartialFailure
          expr: velero_restore_partial_failure_total > 0
          for: 5m
          labels:
            severity: warning
            component: disaster-recovery
            metric: rto
          annotations:
            summary: "Restore completed with partial failures"
            description: "Restore had {{ $value }} partial failures. Full recovery may be compromised."

    - name: backup-health
      interval: 5m
      rules:
        - alert: BackupFailing
          expr: velero_backup_failure_total > 0
          for: 10m
          labels:
            severity: critical
            component: disaster-recovery
          annotations:
            summary: "Backup operations are failing"
            description: "{{ $value }} backup failures detected. DR capability may be compromised."

        - alert: BackupStorageLow
          expr: velero_backup_storage_location_available == 0
          for: 15m
          labels:
            severity: critical
            component: disaster-recovery
          annotations:
            summary: "Backup storage location unavailable"
            description: "Cannot reach backup storage. Backups are not being saved."

---
# CronJob to generate RTO/RPO compliance reports
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rto-rpo-report
  namespace: velero
spec:
  # Run weekly on Monday at 9am
  schedule: "0 9 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 12
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: rto-rpo-reporting
        spec:
          serviceAccountName: dr-tester
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reporter
              image: bitnami/kubectl:1.29
              command:
                - /bin/bash
                - -c
                - |
                  #!/bin/bash

                  echo "╔═══════════════════════════════════════════════════════╗"
                  echo "║          RTO/RPO COMPLIANCE REPORT                   ║"
                  echo "║          $(date)                        ║"
                  echo "╚═══════════════════════════════════════════════════════╝"
                  echo ""

                  # RPO Compliance Check
                  echo "═══ RPO (Recovery Point Objective) Compliance ═══"
                  echo ""

                  # Check each backup schedule
                  echo "Backup Schedule Status:"
                  echo "─────────────────────────────────────────────────────"

                  velero schedule get -o json | jq -r '.items[] |
                    "\(.metadata.name)\t\(.status.lastBackup // "Never")\t\(.spec.schedule)"' | \
                    while IFS=$'\t' read -r name lastbackup schedule; do
                      echo "Schedule: $name"
                      echo "  Frequency: $schedule"
                      echo "  Last Backup: $lastbackup"

                      if [ "$lastbackup" != "Never" ]; then
                        # Get backup details
                        BACKUP_STATUS=$(velero backup get "$lastbackup" -o json 2>/dev/null | jq -r '.status.phase // "Unknown"')
                        echo "  Status: $BACKUP_STATUS"

                        if [ "$BACKUP_STATUS" = "Completed" ]; then
                          echo "  ✅ RPO Compliant"
                        else
                          echo "  ❌ RPO At Risk"
                        fi
                      else
                        echo "  ❌ No backups"
                      fi
                      echo ""
                    done

                  echo ""
                  echo "═══ RTO (Recovery Time Objective) Metrics ═══"
                  echo ""

                  # Get average restore times from recent DR tests
                  echo "Recent DR Test Results:"
                  echo "─────────────────────────────────────────────────────"

                  # Get last 5 DR test jobs
                  kubectl get jobs -n velero -l app=dr-test --sort-by=.metadata.creationTimestamp -o json | \
                    jq -r '.items[-5:] | .[] |
                      "\(.metadata.name)\t\(.status.completionTime // "Running")\t\(.status.succeeded // 0)"' | \
                    while IFS=$'\t' read -r name completion success; do
                      echo "Test: $name"
                      echo "  Completed: $completion"
                      echo "  Status: $([ "$success" = "1" ] && echo "✅ Passed" || echo "❌ Failed")"
                      echo ""
                    done

                  # Check for RTO/RPO alerts
                  echo ""
                  echo "═══ Active RTO/RPO Alerts ═══"
                  echo ""

                  # This would query Prometheus for active alerts
                  # For now, just check recent events
                  kubectl get events -n velero --sort-by='.lastTimestamp' | \
                    grep -E "DRTest|RTO|RPO|Backup" | tail -10 || echo "No recent DR-related events"

                  echo ""
                  echo "═══ Recommendations ═══"
                  echo ""

                  # Check backup age and provide recommendations
                  OLDEST_BACKUP=$(velero backup get -o json | \
                    jq -r '.items | sort_by(.status.completionTimestamp) | .[0].metadata.creationTimestamp')

                  echo "• Oldest backup available: $OLDEST_BACKUP"
                  echo "• Review and test restore procedures quarterly"
                  echo "• Ensure backup retention policies align with compliance requirements"
                  echo "• Monitor backup storage capacity"
                  echo ""

                  echo "╔═══════════════════════════════════════════════════════╗"
                  echo "║              REPORT COMPLETED                        ║"
                  echo "╚═══════════════════════════════════════════════════════╝"
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}

---
# Grafana Dashboard for RTO/RPO monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: rto-rpo-dashboard
  namespace: velero
  labels:
    grafana_dashboard: "1"
data:
  rto-rpo-dashboard.json: |
    {
      "dashboard": {
        "title": "Disaster Recovery - RTO/RPO Monitoring",
        "panels": [
          {
            "title": "RPO - Last Successful Backup Age",
            "targets": [
              {
                "expr": "(time() - velero_backup_last_successful_timestamp) / 3600"
              }
            ],
            "unit": "hours",
            "thresholds": [
              {"value": 6, "color": "yellow"},
              {"value": 24, "color": "red"}
            ]
          },
          {
            "title": "RTO - Average Restore Duration",
            "targets": [
              {
                "expr": "avg(velero_restore_duration_seconds) / 60"
              }
            ],
            "unit": "minutes",
            "thresholds": [
              {"value": 30, "color": "yellow"},
              {"value": 60, "color": "red"}
            ]
          },
          {
            "title": "Backup Success Rate (7 days)",
            "targets": [
              {
                "expr": "(sum(velero_backup_success_total) / (sum(velero_backup_success_total) + sum(velero_backup_failure_total))) * 100"
              }
            ],
            "unit": "percent"
          },
          {
            "title": "DR Test Success Rate",
            "targets": [
              {
                "expr": "sum(kube_job_status_succeeded{job_name=~\".*dr-test.*\"}) / (sum(kube_job_status_succeeded{job_name=~\".*dr-test.*\"}) + sum(kube_job_status_failed{job_name=~\".*dr-test.*\"})) * 100"
              }
            ],
            "unit": "percent"
          }
        ]
      }
    }
