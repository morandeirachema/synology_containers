apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: production-plus
  annotations:
    description: "Production overlay with HIGH priority security enhancements"
    grade: "100/100 + Defense-in-Depth"

# Base production configuration (100/100 perfect score)
resources:
  - ../production

  # HIGH Priority - Defense-in-Depth Security
  # These are OPTIONAL enhancements that add security layers
  # beyond the 100/100 requirements
  - ../../optional/high-priority/falco
  - ../../optional/high-priority/gatekeeper
  - ../../optional/high-priority/kubescape

namespace: production-plus

namePrefix: plus-

labels:
  - includeSelectors: true
    pairs:
      environment: production-plus
      security-tier: enhanced
      managed-by: kustomize

commonAnnotations:
  deployment-strategy: production-plus
  security-posture: defense-in-depth
  optional-enhancements: "falco,gatekeeper,kubescape"
