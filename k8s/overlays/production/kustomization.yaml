apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: production-stack-a-plus
  namespace: production
  annotations:
    grade: "A+"
    security-level: "restricted"
    ha-enabled: "true"

# Reference base configurations
bases:
  - ../../base/security  # A+ Security baseline
  - ../../base/ha        # High Availability configs
  - ../../base/traefik
  - ../../base/authelia
  - ../../base/vaultwarden
  - ../../base/nextcloud
  - ../../base/homepage
  - ../../base/it-tools

# Production namespace
namespace: production

# Common labels for all resources
commonLabels:
  environment: production
  managed-by: kustomize
  security-grade: a-plus

# Common annotations
commonAnnotations:
  environment: production
  contact: admin@yourdomain.com
  deployment-method: gitops

# Production-specific patches
patchesStrategicMerge:
  - replicas-patch.yaml
  - resources-patch.yaml
  - ../../base/security/security-hardening.yaml  # Security hardening

# Production image tags (pinned versions for stability)
images:
  - name: traefik
    newTag: v3.0.0
  - name: authelia/authelia
    newTag: 4.38.0
  - name: vaultwarden/server
    newTag: 1.30.5-alpine
  - name: nextcloud
    newTag: 28.0.3-apache
  - name: ghcr.io/gethomepage/homepage
    newTag: v0.8.10
  - name: corentinth/it-tools
    newTag: 2024.5.13-a0bc346
  - name: postgres
    newTag: 16-alpine
  - name: redis
    newTag: 7-alpine

# Production replicas configuration (overridden by HPA)
replicas:
  - name: traefik
    count: 3
  - name: authelia
    count: 3
  - name: homepage
    count: 2
  - name: it-tools
    count: 2
