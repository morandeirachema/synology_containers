apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: production-stack
  namespace: production

# Reference base configurations
bases:
  - ../../base/traefik
  - ../../base/authelia
  - ../../base/vaultwarden
  - ../../base/nextcloud
  - ../../base/homepage
  - ../../base/it-tools

# Production namespace
namespace: production

# Common labels for all resources
commonLabels:
  environment: production
  managed-by: kustomize

# Common annotations
commonAnnotations:
  environment: production
  contact: admin@yourdomain.com

# Production-specific patches
patchesStrategicMerge:
  - replicas-patch.yaml
  - resources-patch.yaml

# Production image tags (pinned versions)
images:
  - name: traefik
    newTag: v3.0.0
  - name: authelia/authelia
    newTag: 4.38.0
  - name: vaultwarden/server
    newTag: 1.30.5-alpine
  - name: nextcloud
    newTag: 28.0.3-apache
  - name: ghcr.io/gethomepage/homepage
    newTag: v0.8.10
  - name: corentinth/it-tools
    newTag: 2024.5.13-a0bc346

# Production replicas configuration
replicas:
  - name: traefik
    count: 3
  - name: authelia
    count: 3
  - name: homepage
    count: 2
  - name: it-tools
    count: 2
