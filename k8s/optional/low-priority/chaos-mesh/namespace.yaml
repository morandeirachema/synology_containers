apiVersion: v1
kind: Namespace
metadata:
  name: chaos-mesh
  labels:
    name: chaos-mesh
    app.kubernetes.io/name: chaos-mesh
    # Chaos Mesh requires privileged access for chaos-daemon
    # to inject failures at the kernel/container runtime level
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
