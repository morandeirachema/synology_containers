# Thanos Compactor - Downsamples and compacts blocks in object storage
# Applies retention policies and cleans up old data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-compactor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: compactor
spec:
  replicas: 1  # MUST be 1 (uses distributed locks, not horizontally scalable)
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: compactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos
        app.kubernetes.io/component: compactor
    spec:
      serviceAccountName: thanos
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thanos-compactor
          image: quay.io/thanos/thanos:v0.35.0
          args:
            - compact
            - --data-dir=/var/thanos/compactor
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --http-address=0.0.0.0:10902
            - --log.level=info
            - --log.format=logfmt
            # Retention policies (adjust based on your needs)
            - --retention.resolution-raw=14d       # Keep raw data for 14 days
            - --retention.resolution-5m=180d       # Keep 5m downsampled for 6 months
            - --retention.resolution-1h=0d         # Keep 1h downsampled forever (0d = infinite)
            # Downsampling configuration
            - --downsampling.disable=false         # Enable downsampling
            # Compaction configuration
            - --compact.concurrency=1              # Compaction parallelism
            - --delete-delay=48h                   # Safety delay before deleting blocks
            # Consistency checks
            - --consistency-delay=30m              # Wait for block upload completion
            - --compact.cleanup-interval=5m        # Cleanup check interval
          ports:
            - name: http
              containerPort: 10902
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/thanos/compactor
            - name: objstore-config
              mountPath: /etc/thanos
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: thanos-compactor-data
        - name: objstore-config
          secret:
            secretName: thanos-objstore-config
        - name: tmp
          emptyDir: {}
---
# PVC for Compactor working directory
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thanos-compactor-data
  namespace: monitoring
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: compactor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi  # Working directory for compaction operations
  # storageClassName: fast-ssd  # Optional: use faster storage
---
# Service for Compactor metrics
apiVersion: v1
kind: Service
metadata:
  name: thanos-compactor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: compactor
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 10902
      targetPort: http
  selector:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: compactor
