# RBAC for OpenCost
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opencost
rules:
  # Read nodes for capacity and pricing
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list

  # Read pods for allocation
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list

  # Read namespaces for cost grouping
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list

  # Read PVs and PVCs for storage costs
  - apiGroups:
      - ""
    resources:
      - persistentvolumes
      - persistentvolumeclaims
    verbs:
      - get
      - list

  # Read ReplicaSets and Deployments for ownership
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
      - daemonsets
      - statefulsets
    verbs:
      - get
      - list

  # Read Jobs for batch workload costs
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list

  # Read Services for network costs (future)
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opencost
subjects:
  - kind: ServiceAccount
    name: opencost
    namespace: opencost
