apiVersion: v1
kind: Service
metadata:
  name: gatekeeper-metrics
  namespace: gatekeeper-system
  labels:
    control-plane: controller-manager
spec:
  selector:
    control-plane: controller-manager
  ports:
    - name: metrics
      port: 8888
      targetPort: 8888
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: gatekeeper-audit-metrics
  namespace: gatekeeper-system
  labels:
    control-plane: audit-controller
spec:
  selector:
    control-plane: audit-controller
  ports:
    - name: metrics
      port: 8888
      targetPort: 8888
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gatekeeper-controller
  namespace: gatekeeper-system
  labels:
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gatekeeper-audit
  namespace: gatekeeper-system
  labels:
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      control-plane: audit-controller
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gatekeeper-alerts
  namespace: gatekeeper-system
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: gatekeeper.rules
      interval: 30s
      rules:
        # Webhook availability
        - alert: GatekeeperWebhookDown
          expr: up{job="gatekeeper-controller"} == 0
          for: 5m
          labels:
            severity: critical
            component: gatekeeper
          annotations:
            summary: "Gatekeeper webhook is down"
            description: "Gatekeeper webhook has been down for more than 5 minutes. Policies are not being enforced."

        # Audit controller availability
        - alert: GatekeeperAuditDown
          expr: up{job="gatekeeper-audit"} == 0
          for: 5m
          labels:
            severity: warning
            component: gatekeeper
          annotations:
            summary: "Gatekeeper audit controller is down"
            description: "Gatekeeper audit controller has been down for more than 5 minutes"

        # Constraint violations detected
        - alert: GatekeeperConstraintViolations
          expr: sum(gatekeeper_violations{enforcement_action="deny"}) > 0
          for: 15m
          labels:
            severity: warning
            component: gatekeeper
          annotations:
            summary: "Gatekeeper detected constraint violations"
            description: "{{ $value }} constraint violations detected in the last 15 minutes"

        # High webhook latency
        - alert: GatekeeperHighLatency
          expr: histogram_quantile(0.99, rate(gatekeeper_webhook_request_duration_seconds_bucket[5m])) > 1
          for: 10m
          labels:
            severity: warning
            component: gatekeeper
          annotations:
            summary: "Gatekeeper webhook has high latency"
            description: "P99 latency is {{ $value }}s (threshold: 1s)"

        # Webhook errors
        - alert: GatekeeperWebhookErrors
          expr: rate(gatekeeper_webhook_request_total{status="error"}[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
            component: gatekeeper
          annotations:
            summary: "Gatekeeper webhook experiencing errors"
            description: "{{ $value | humanizePercentage }} of webhook requests are failing"

        # Audit errors
        - alert: GatekeeperAuditErrors
          expr: rate(gatekeeper_audit_duration_seconds_count[5m]) == 0
          for: 15m
          labels:
            severity: warning
            component: gatekeeper
          annotations:
            summary: "Gatekeeper audit not running"
            description: "No audit runs detected in the last 15 minutes"

        # Template sync failures
        - alert: GatekeeperTemplateSyncFailure
          expr: gatekeeper_sync{status="error"} > 0
          for: 5m
          labels:
            severity: warning
            component: gatekeeper
          annotations:
            summary: "Gatekeeper template sync failures"
            description: "Gatekeeper is failing to sync constraint templates"

        # High memory usage
        - alert: GatekeeperHighMemory
          expr: container_memory_working_set_bytes{pod=~"gatekeeper-.*",namespace="gatekeeper-system"} / container_spec_memory_limit_bytes{pod=~"gatekeeper-.*",namespace="gatekeeper-system"} > 0.9
          for: 5m
          labels:
            severity: warning
            component: gatekeeper
          annotations:
            summary: "Gatekeeper pod using high memory"
            description: "{{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit"

        # Constraint template errors
        - alert: GatekeeperInvalidTemplates
          expr: gatekeeper_constraint_templates{status="error"} > 0
          for: 5m
          labels:
            severity: warning
            component: gatekeeper
          annotations:
            summary: "Invalid Gatekeeper constraint templates"
            description: "{{ $value }} constraint templates have errors"
