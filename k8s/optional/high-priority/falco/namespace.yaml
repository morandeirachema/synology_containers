apiVersion: v1
kind: Namespace
metadata:
  name: falco
  labels:
    name: falco
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Note: Falco requires privileged access for kernel syscall monitoring
# This is expected and necessary for runtime security detection
