apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: security-baseline
  annotations:
    description: "A+ Security baseline for Kubernetes cluster"

resources:
  - namespaces.yaml
  - networkpolicies.yaml
  - resourcequotas.yaml

commonLabels:
  security.kubernetes.io/baseline: "restricted"
  managed-by: kustomize
