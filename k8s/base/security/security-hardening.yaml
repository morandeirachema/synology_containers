---
# IT-Tools deployment hardening
apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-tools
  namespace: tools
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: it-tools
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /.cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
# Vaultwarden statefulset hardening
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vaultwarden
  namespace: production
spec:
  updateStrategy:
    type: RollingUpdate
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vaultwarden
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false  # Needs to write to /data
            seccompProfile:
              type: RuntimeDefault
---
# Nextcloud statefulset hardening
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextcloud
  namespace: production
spec:
  updateStrategy:
    type: RollingUpdate
  template:
    spec:
      securityContext:
        runAsNonRoot: false  # Nextcloud needs root for some operations
        fsGroup: 33  # www-data
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nextcloud
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
