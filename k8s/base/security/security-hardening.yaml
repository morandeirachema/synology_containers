# Security Hardening Patches
# Add seccompProfile and update strategies to all deployments/statefulsets

---
# Fix Traefik security context
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime updates
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532  # nobody user
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE  # Required for ports 80/443
            readOnlyRootFilesystem: false  # Traefik needs to write acme.json
            seccompProfile:
              type: RuntimeDefault
---
# Authelia deployment hardening
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: security
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authelia
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false  # Needs to write config
            seccompProfile:
              type: RuntimeDefault
