apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: traefik
  namespace: traefik

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - rbac.yaml
  - middleware.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: traefik
  app.kubernetes.io/component: ingress-controller

images:
  - name: traefik
    newTag: v3.0

# Secret Generator - Uses external env file for security
# Copy cloudflare-credentials.env.example to cloudflare-credentials.env
# and fill in your actual credentials
secretGenerator:
  - name: cloudflare-api-credentials
    envs:
      - cloudflare-credentials.env
