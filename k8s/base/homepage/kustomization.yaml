apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: homepage
  namespace: default

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - configmap.yaml
  - rbac.yaml

commonLabels:
  app.kubernetes.io/name: homepage
  app.kubernetes.io/component: dashboard

images:
  - name: ghcr.io/gethomepage/homepage
    newTag: latest
