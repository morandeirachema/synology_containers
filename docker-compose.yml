version: '3.8'

##################################################
# Synology DS 224+ Production Container Stack
# 15 Services | 16GB RAM Optimized
# Security, Automation, Productivity, Monitoring
##################################################

networks:
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  homeautomation:
    driver: bridge
  storage:
    driver: bridge
  monitoring:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  prometheus_data:
  grafana_data:
  portainer_data:
  traefik_acme:

services:

  ############################################
  # 1. TRAEFIK - Reverse Proxy & SSL
  ############################################
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard (disable in production)
    environment:
      - CF_API_EMAIL=${CF_API_EMAIL}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/traefik.yml:ro
      - ./config/traefik/dynamic:/dynamic:ro
      - traefik_acme:/acme
      - ./logs/traefik:/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=https"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=authelia@docker"
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  ############################################
  # 2. AUTHELIA - 2FA Authentication
  ############################################
  authelia:
    image: authelia/authelia:4.38
    container_name: authelia
    restart: unless-stopped
    networks:
      - proxy
      - internal
    expose:
      - 9091
    environment:
      - TZ=${TZ}
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY}
    volumes:
      - ./config/authelia:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.authelia.entrypoints=https"
      - "traefik.http.middlewares.authelia.forwardAuth.address=http://authelia:9091/api/verify?rd=https%3A%2F%2Fauth.${DOMAIN}%2F"
      - "traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
    mem_limit: 256m
    cpus: 0.3
    depends_on:
      - traefik

  ############################################
  # 3. WIREGUARD - VPN Server
  ############################################
  wireguard:
    image: linuxserver/wireguard:1.0.20210914
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - SERVERURL=${WIREGUARD_SERVERURL}
      - SERVERPORT=51820
      - PEERS=${WIREGUARD_PEERS}
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - ./config/wireguard:/config
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    mem_limit: 128m
    cpus: 0.5

  ############################################
  # 4. VAULTWARDEN - Password Manager
  ############################################
  vaultwarden:
    image: vaultwarden/server:1.30.5-alpine
    container_name: vaultwarden
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - 80
    environment:
      - DOMAIN=https://vault.${DOMAIN}
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURITY=${SMTP_SECURITY}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - TZ=${TZ}
    volumes:
      - ./data/vaultwarden:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=https"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - traefik

  ############################################
  # 5. ADGUARD HOME - DNS & Ad Blocking
  ############################################
  adguardhome:
    image: adguard/adguardhome:v0.107.43
    container_name: adguardhome
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3001:3000/tcp"  # Web UI
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/adguardhome/work:/opt/adguardhome/work
      - ./config/adguardhome/conf:/opt/adguardhome/conf
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adguard.rule=Host(`dns.${DOMAIN}`)"
      - "traefik.http.routers.adguard.entrypoints=https"
      - "traefik.http.services.adguard.loadbalancer.server.port=3000"
      - "traefik.http.routers.adguard.middlewares=authelia@docker"
    mem_limit: 256m
    cpus: 0.5

  ############################################
  # 6. HOME ASSISTANT - Home Automation
  ############################################
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2024.11
    container_name: homeassistant
    restart: unless-stopped
    privileged: true
    networks:
      - proxy
      - homeautomation
    ports:
      - "8123:8123"
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homeassistant.rule=Host(`ha.${DOMAIN}`)"
      - "traefik.http.routers.homeassistant.entrypoints=https"
      - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"
    mem_limit: 1024m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - mosquitto

  ############################################
  # 7. NODE-RED - Automation Flows
  ############################################
  nodered:
    image: nodered/node-red:3.1.3
    container_name: nodered
    restart: unless-stopped
    networks:
      - proxy
      - homeautomation
    expose:
      - 1880
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/nodered:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nodered.rule=Host(`nodered.${DOMAIN}`)"
      - "traefik.http.routers.nodered.entrypoints=https"
      - "traefik.http.services.nodered.loadbalancer.server.port=1880"
      - "traefik.http.routers.nodered.middlewares=authelia@docker"
    mem_limit: 512m
    cpus: 0.5
    user: "1000:1000"
    depends_on:
      - mosquitto

  ############################################
  # 8. MOSQUITTO - MQTT Broker
  ############################################
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - homeautomation
    ports:
      - "1883:1883"
      - "9001:9001"
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/mosquitto:/mosquitto/config
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    mem_limit: 128m
    cpus: 0.3
    user: "1000:1000"

  ############################################
  # 9. NEXTCLOUD - File Sync & Productivity
  ############################################
  nextcloud:
    image: nextcloud:28.0.1-apache
    container_name: nextcloud
    restart: unless-stopped
    networks:
      - proxy
      - storage
    expose:
      - 80
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=cloud.${DOMAIN} ${NAS_IP}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=cloud.${DOMAIN}
    volumes:
      - ./data/nextcloud:/var/www/html
      - ${NEXTCLOUD_DATA_PATH}:/var/www/html/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`cloud.${DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=https"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-caldav,nextcloud-headers"
      - "traefik.http.middlewares.nextcloud-caldav.redirectregex.permanent=true"
      - "traefik.http.middlewares.nextcloud-caldav.redirectregex.regex=^https://(.*)/.well-known/(card|cal)dav"
      - "traefik.http.middlewares.nextcloud-caldav.redirectregex.replacement=https://$${1}/remote.php/dav/"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsSeconds=155520011"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsPreload=true"
    mem_limit: 2048m
    cpus: 1.5
    depends_on:
      - nextcloud-db
      - traefik

  nextcloud-db:
    image: mariadb:11.2
    container_name: nextcloud-db
    restart: unless-stopped
    networks:
      - storage
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - TZ=${TZ}
    volumes:
      - ./data/nextcloud-db:/var/lib/mysql
    mem_limit: 512m
    cpus: 0.5

  ############################################
  # 10. IMMICH - Photo Management
  ############################################
  immich-server:
    image: ghcr.io/immich-app/immich-server:v1.117.0
    container_name: immich-server
    restart: unless-stopped
    networks:
      - proxy
      - storage
    expose:
      - 3001
    environment:
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
      - TZ=${TZ}
      - UPLOAD_LOCATION=${IMMICH_UPLOAD_LOCATION}
    volumes:
      - ${IMMICH_UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`photos.${DOMAIN}`)"
      - "traefik.http.routers.immich.entrypoints=https"
      - "traefik.http.services.immich.loadbalancer.server.port=3001"
    mem_limit: 2048m
    cpus: 2.0
    depends_on:
      - immich-redis
      - immich-postgres

  immich-redis:
    image: redis:7.2-alpine
    container_name: immich-redis
    restart: unless-stopped
    networks:
      - storage
    mem_limit: 128m
    cpus: 0.3

  immich-postgres:
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: immich-postgres
    restart: unless-stopped
    networks:
      - storage
    environment:
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
    volumes:
      - ./data/immich-postgres:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.5

  ############################################
  # 11. PAPERLESS-NGX - Document Management
  ############################################
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.3.3
    container_name: paperless-ngx
    restart: unless-stopped
    networks:
      - proxy
      - storage
    expose:
      - 8000
    environment:
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - PAPERLESS_DBHOST=paperless-db
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PASSWORD}
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_URL=https://docs.${DOMAIN}
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      - PAPERLESS_TIME_ZONE=${TZ}
      - PAPERLESS_OCR_LANGUAGE=eng
      - USERMAP_UID=1000
      - USERMAP_GID=1000
    volumes:
      - ./data/paperless/data:/usr/src/paperless/data
      - ./data/paperless/media:/usr/src/paperless/media
      - ${PAPERLESS_EXPORT_DIR}:/usr/src/paperless/export
      - ${PAPERLESS_CONSUME_DIR}:/usr/src/paperless/consume
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless.rule=Host(`docs.${DOMAIN}`)"
      - "traefik.http.routers.paperless.entrypoints=https"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
    mem_limit: 1024m
    cpus: 1.0
    depends_on:
      - paperless-db
      - paperless-redis

  paperless-db:
    image: postgres:16-alpine
    container_name: paperless-db
    restart: unless-stopped
    networks:
      - storage
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=${PAPERLESS_DB_PASSWORD}
    volumes:
      - ./data/paperless-db:/var/lib/postgresql/data
    mem_limit: 256m
    cpus: 0.3

  paperless-redis:
    image: redis:7.2-alpine
    container_name: paperless-redis
    restart: unless-stopped
    networks:
      - storage
    mem_limit: 128m
    cpus: 0.3

  ############################################
  # 12. PORTAINER - Container Management
  ############################################
  portainer:
    image: portainer/portainer-ce:2.19.4-alpine
    container_name: portainer
    restart: unless-stopped
    networks:
      - proxy
      - monitoring
    ports:
      - "9000:9000"
      - "9443:9443"
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)"
      - "traefik.http.routers.portainer.entrypoints=https"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    mem_limit: 256m
    cpus: 0.5

  ############################################
  # 13. UPTIME KUMA - Uptime Monitoring
  ############################################
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.11-alpine
    container_name: uptime-kuma
    restart: unless-stopped
    networks:
      - proxy
      - monitoring
    expose:
      - 3001
    environment:
      - TZ=${TZ}
    volumes:
      - ./data/uptime-kuma:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`status.${DOMAIN}`)"
      - "traefik.http.routers.uptime.entrypoints=https"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"
    mem_limit: 256m
    cpus: 0.5

  ############################################
  # 14. GRAFANA - Metrics Visualization
  ############################################
  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    restart: unless-stopped
    networks:
      - proxy
      - monitoring
    expose:
      - 3000
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel
      - TZ=${TZ}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=https"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.middlewares=authelia@docker"
    mem_limit: 512m
    cpus: 0.5
    user: "1000"
    depends_on:
      - prometheus

  ############################################
  # 15. PROMETHEUS - Metrics Collection
  ############################################
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    restart: unless-stopped
    networks:
      - monitoring
      - internal
    expose:
      - 9090
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    mem_limit: 1024m
    cpus: 1.0
    user: "1000"

  ############################################
  # 16. CADVISOR - Container Metrics
  ############################################
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    networks:
      - monitoring
    expose:
      - 8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    mem_limit: 256m
    cpus: 0.5
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=30s'
      - '--disable_metrics=disk,diskIO,network,tcp,udp,percpu,sched,process'

  ############################################
  # 17. HOMEPAGE - Dashboard
  ############################################
  homepage:
    image: ghcr.io/gethomepage/homepage:v0.8.4
    container_name: homepage
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - 3000
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`home.${DOMAIN}`) || Host(`${DOMAIN}`)"
      - "traefik.http.routers.homepage.entrypoints=https"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      - "traefik.http.routers.homepage.middlewares=authelia@docker"
    mem_limit: 256m
    cpus: 0.3

  ############################################
  # 18. DIUN - Docker Image Update Notifier
  ############################################
  diun:
    image: crazymax/diun:4.28.0
    container_name: diun
    restart: unless-stopped
    networks:
      - monitoring
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=0 */6 * * *
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_GOTIFY_ENDPOINT=${GOTIFY_ENDPOINT}
      - DIUN_NOTIF_GOTIFY_TOKEN=${GOTIFY_TOKEN}
    volumes:
      - ./config/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m
    cpus: 0.3

  ############################################
  # 19. DOZZLE - Log Viewer
  ############################################
  dozzle:
    image: amir20/dozzle:v5.5.0
    container_name: dozzle
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - 8080
    environment:
      - TZ=${TZ}
      - DOZZLE_LEVEL=info
      - DOZZLE_TAILSIZE=300
      - DOZZLE_FILTER=status=running
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`logs.${DOMAIN}`)"
      - "traefik.http.routers.dozzle.entrypoints=https"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
      - "traefik.http.routers.dozzle.middlewares=authelia@docker"
    mem_limit: 128m
    cpus: 0.3

  ############################################
  # 20. IT-TOOLS - Utility Collection
  ############################################
  it-tools:
    image: corentinth/it-tools:2023.12.21-5ed3693
    container_name: it-tools
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - 80
    environment:
      - TZ=${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ittools.rule=Host(`tools.${DOMAIN}`)"
      - "traefik.http.routers.ittools.entrypoints=https"
      - "traefik.http.services.ittools.loadbalancer.server.port=80"
      - "traefik.http.routers.ittools.middlewares=authelia@docker"
    mem_limit: 128m
    cpus: 0.3
