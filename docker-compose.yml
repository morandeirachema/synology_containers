version: '3.8'

##################################################
# Synology DS 224+ Production Container Stack
# 12 Services | 16GB RAM Optimized
# Security, Productivity, Monitoring
##################################################

networks:
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  storage:
    driver: bridge
  monitoring:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  prometheus_data:
  grafana_data:
  portainer_data:
  traefik_acme:

services:

  ############################################
  # 1. TRAEFIK - Reverse Proxy & SSL
  ############################################
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard (disable in production)
    environment:
      - CF_API_EMAIL=${CF_API_EMAIL}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/traefik.yml:ro
      - ./config/traefik/dynamic:/dynamic:ro
      - traefik_acme:/acme
      - ./logs/traefik:/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=https"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=authelia@docker"
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  ############################################
  # 2. AUTHELIA - 2FA Authentication
  ############################################
  authelia:
    image: authelia/authelia:4.38
    container_name: authelia
    restart: unless-stopped
    networks:
      - proxy
      - internal
    expose:
      - 9091
    environment:
      - TZ=${TZ}
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY}
    volumes:
      - ./config/authelia:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.authelia.entrypoints=https"
      - "traefik.http.middlewares.authelia.forwardAuth.address=http://authelia:9091/api/verify?rd=https%3A%2F%2Fauth.${DOMAIN}%2F"
      - "traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
    mem_limit: 256m
    cpus: 0.3
    depends_on:
      - traefik

  ############################################
  # 3. WIREGUARD - VPN Server
  ############################################
  wireguard:
    image: linuxserver/wireguard:1.0.20210914
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - SERVERURL=${WIREGUARD_SERVERURL}
      - SERVERPORT=51820
      - PEERS=${WIREGUARD_PEERS}
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - ./config/wireguard:/config
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    mem_limit: 128m
    cpus: 0.5

  ############################################
  # 4. VAULTWARDEN - Password Manager
  ############################################
  vaultwarden:
    image: vaultwarden/server:1.30.5-alpine
    container_name: vaultwarden
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - 80
    environment:
      - DOMAIN=https://vault.${DOMAIN}
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURITY=${SMTP_SECURITY}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - TZ=${TZ}
    volumes:
      - ./data/vaultwarden:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=https"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - traefik

  ############################################
  # 5. PI-HOLE - DNS & Ad Blocking
  ############################################
  pihole:
    image: pihole/pihole:2024.07.0
    container_name: pihole
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80/tcp"  # Web UI
    environment:
      - TZ=${TZ}
      - WEBPASSWORD=${PIHOLE_PASSWORD}
      - SERVERIP=${NAS_IP}
      - DNS1=1.1.1.1
      - DNS2=1.0.0.1
      - DNSMASQ_LISTENING=all
    volumes:
      - ./config/pihole/etc-pihole:/etc/pihole
      - ./config/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`dns.${DOMAIN}`)"
      - "traefik.http.routers.pihole.entrypoints=https"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
      - "traefik.http.routers.pihole.middlewares=authelia@docker"
    mem_limit: 256m
    cpus: 0.5
    cap_add:
      - NET_ADMIN
    dns:
      - 127.0.0.1
      - 1.1.1.1

  ############################################
  # 6. NEXTCLOUD - File Sync & Productivity
  ############################################
  nextcloud:
    image: nextcloud:28.0.1-apache
    container_name: nextcloud
    restart: unless-stopped
    networks:
      - proxy
      - storage
    expose:
      - 80
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=cloud.${DOMAIN} ${NAS_IP}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=cloud.${DOMAIN}
    volumes:
      - ./data/nextcloud:/var/www/html
      - ${NEXTCLOUD_DATA_PATH}:/var/www/html/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`cloud.${DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=https"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-caldav,nextcloud-headers"
      - "traefik.http.middlewares.nextcloud-caldav.redirectregex.permanent=true"
      - "traefik.http.middlewares.nextcloud-caldav.redirectregex.regex=^https://(.*)/.well-known/(card|cal)dav"
      - "traefik.http.middlewares.nextcloud-caldav.redirectregex.replacement=https://$${1}/remote.php/dav/"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsSeconds=155520011"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsPreload=true"
    mem_limit: 2048m
    cpus: 1.5
    depends_on:
      - nextcloud-db
      - traefik

  nextcloud-db:
    image: mariadb:11.2
    container_name: nextcloud-db
    restart: unless-stopped
    networks:
      - storage
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - TZ=${TZ}
    volumes:
      - ./data/nextcloud-db:/var/lib/mysql
    mem_limit: 512m
    cpus: 0.5

  ############################################
  # 7. PORTAINER - Container Management
  ############################################
  portainer:
    image: portainer/portainer-ce:2.19.4-alpine
    container_name: portainer
    restart: unless-stopped
    networks:
      - proxy
      - monitoring
    ports:
      - "9000:9000"
      - "9443:9443"
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)"
      - "traefik.http.routers.portainer.entrypoints=https"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    mem_limit: 256m
    cpus: 0.5

  ############################################
  # 8. UPTIME KUMA - Uptime Monitoring
  ############################################
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.11-alpine
    container_name: uptime-kuma
    restart: unless-stopped
    networks:
      - proxy
      - monitoring
    expose:
      - 3001
    environment:
      - TZ=${TZ}
    volumes:
      - ./data/uptime-kuma:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`status.${DOMAIN}`)"
      - "traefik.http.routers.uptime.entrypoints=https"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"
    mem_limit: 256m
    cpus: 0.5

  ############################################
  # 9. GRAFANA - Metrics Visualization
  ############################################
  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    restart: unless-stopped
    networks:
      - proxy
      - monitoring
    expose:
      - 3000
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel
      - TZ=${TZ}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=https"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.middlewares=authelia@docker"
    mem_limit: 512m
    cpus: 0.5
    user: "1000"
    depends_on:
      - prometheus

  ############################################
  # 10. PROMETHEUS - Metrics Collection
  ############################################
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    restart: unless-stopped
    networks:
      - monitoring
      - internal
    expose:
      - 9090
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    mem_limit: 1024m
    cpus: 1.0
    user: "1000"

  ############################################
  # 11. CADVISOR - Container Metrics
  ############################################
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    networks:
      - monitoring
    expose:
      - 8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    mem_limit: 256m
    cpus: 0.5
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=30s'
      - '--disable_metrics=disk,diskIO,network,tcp,udp,percpu,sched,process'

  ############################################
  # 12. HOMEPAGE - Dashboard
  ############################################
  homepage:
    image: ghcr.io/gethomepage/homepage:v0.8.4
    container_name: homepage
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - 3000
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`home.${DOMAIN}`) || Host(`${DOMAIN}`)"
      - "traefik.http.routers.homepage.entrypoints=https"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      - "traefik.http.routers.homepage.middlewares=authelia@docker"
    mem_limit: 256m
    cpus: 0.3

  ############################################
  # 13. DIUN - Docker Image Update Notifier
  ############################################
  diun:
    image: crazymax/diun:4.28.0
    container_name: diun
    restart: unless-stopped
    networks:
      - monitoring
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=0 */6 * * *
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_GOTIFY_ENDPOINT=${GOTIFY_ENDPOINT}
      - DIUN_NOTIF_GOTIFY_TOKEN=${GOTIFY_TOKEN}
    volumes:
      - ./config/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m
    cpus: 0.3

  ############################################
  # 14. DOZZLE - Log Viewer
  ############################################
  dozzle:
    image: amir20/dozzle:v5.5.0
    container_name: dozzle
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - 8080
    environment:
      - TZ=${TZ}
      - DOZZLE_LEVEL=info
      - DOZZLE_TAILSIZE=300
      - DOZZLE_FILTER=status=running
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`logs.${DOMAIN}`)"
      - "traefik.http.routers.dozzle.entrypoints=https"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
      - "traefik.http.routers.dozzle.middlewares=authelia@docker"
    mem_limit: 128m
    cpus: 0.3

  ############################################
  # 15. IT-TOOLS - Utility Collection
  ############################################
  it-tools:
    image: corentinth/it-tools:2023.12.21-5ed3693
    container_name: it-tools
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - 80
    environment:
      - TZ=${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ittools.rule=Host(`tools.${DOMAIN}`)"
      - "traefik.http.routers.ittools.entrypoints=https"
      - "traefik.http.services.ittools.loadbalancer.server.port=80"
      - "traefik.http.routers.ittools.middlewares=authelia@docker"
    mem_limit: 128m
    cpus: 0.3
