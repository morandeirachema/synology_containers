# Terraform CI/CD Pipeline
# Validates and applies Terraform configurations for infrastructure
#
# Triggers:
#   - Push to main branch (auto-apply)
#   - Pull requests (plan only)
#   - Manual dispatch

name: Terraform

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      module:
        description: 'Module to run (proxmox or talos)'
        required: true
        default: 'proxmox'
        type: choice
        options:
          - proxmox
          - talos
          - all

env:
  TF_VERSION: '1.9.0'
  TF_IN_AUTOMATION: 'true'

jobs:
  # ===========================================================================
  # Validate Terraform configurations
  # ===========================================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        module: [proxmox, talos]

    defaults:
      run:
        working-directory: infrastructure/terraform/${{ matrix.module }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Comment on PR (Format)
        if: github.event_name == 'pull_request' && steps.fmt.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Terraform formatting issues in `${{ matrix.module }}` module. Run `terraform fmt` to fix.'
            })

  # ===========================================================================
  # Security scanning with tfsec
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/terraform
          soft_fail: true

  # ===========================================================================
  # Terraform Plan
  # ===========================================================================
  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: [validate, security]
    if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan'

    strategy:
      matrix:
        module: [proxmox, talos]
      fail-fast: false

    defaults:
      run:
        working-directory: infrastructure/terraform/${{ matrix.module }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true
        env:
          TF_VAR_proxmox_api_password: ${{ secrets.PROXMOX_API_PASSWORD }}

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infrastructure/terraform/${{ matrix.module }}/plan.txt', 'utf8');
            const truncated = plan.length > 65000 ? plan.substring(0, 65000) + '\n... (truncated)' : plan;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan - \`${{ matrix.module }}\`

            <details>
            <summary>Show Plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            **Status**: ${{ steps.plan.outcome == 'success' && '✅ Success' || '❌ Failed' }}`
            })

  # ===========================================================================
  # Terraform Apply (main branch only)
  # ===========================================================================
  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: [validate, security]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment: production

    strategy:
      matrix:
        module: [proxmox, talos]
      max-parallel: 1  # Apply sequentially

    defaults:
      run:
        working-directory: infrastructure/terraform/${{ matrix.module }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_proxmox_api_password: ${{ secrets.PROXMOX_API_PASSWORD }}

      - name: Upload Terraform State
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-${{ matrix.module }}
          path: infrastructure/terraform/${{ matrix.module }}/terraform.tfstate
          retention-days: 90

  # ===========================================================================
  # Notification
  # ===========================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [apply]
    if: always() && (needs.apply.result == 'success' || needs.apply.result == 'failure')

    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.apply.result }}" == "success" ]; then
            echo "✅ Terraform apply completed successfully"
          else
            echo "❌ Terraform apply failed"
          fi
