---
# Homepage Dashboard Configuration
# Customize this file to show your services

- Security & Privacy:
    - Vaultwarden:
        icon: vaultwarden.png
        href: https://vault.{{HOMEPAGE_VAR_DOMAIN}}
        description: Password Manager
        widget:
          type: vaultwarden
          url: http://vaultwarden

    - Authelia:
        icon: authelia.png
        href: https://auth.{{HOMEPAGE_VAR_DOMAIN}}
        description: 2FA Authentication

    - AdGuard Home:
        icon: adguard-home.png
        href: https://dns.{{HOMEPAGE_VAR_DOMAIN}}
        description: DNS & Ad Blocking
        widget:
          type: adguard
          url: http://adguardhome:3000
          username: {{HOMEPAGE_VAR_ADGUARD_USER}}
          password: {{HOMEPAGE_VAR_ADGUARD_PASS}}

    - WireGuard:
        icon: wireguard.png
        href: #
        description: VPN Server

- Home Automation:
    - Home Assistant:
        icon: home-assistant.png
        href: https://ha.{{HOMEPAGE_VAR_DOMAIN}}
        description: Smart Home Platform
        widget:
          type: homeassistant
          url: http://homeassistant:8123
          key: {{HOMEPAGE_VAR_HA_TOKEN}}

    - Node-RED:
        icon: node-red.png
        href: https://nodered.{{HOMEPAGE_VAR_DOMAIN}}
        description: Automation Flows

    - MQTT Broker:
        icon: mosquitto.png
        href: #
        description: IoT Message Broker

- Productivity & Storage:
    - Nextcloud:
        icon: nextcloud.png
        href: https://cloud.{{HOMEPAGE_VAR_DOMAIN}}
        description: File Sync & Productivity

    - Immich:
        icon: immich.png
        href: https://photos.{{HOMEPAGE_VAR_DOMAIN}}
        description: Photo Management
        widget:
          type: immich
          url: http://immich-server:3001
          key: {{HOMEPAGE_VAR_IMMICH_KEY}}

    - Paperless-ngx:
        icon: paperless.png
        href: https://docs.{{HOMEPAGE_VAR_DOMAIN}}
        description: Document Management
        widget:
          type: paperlessngx
          url: http://paperless-ngx:8000
          username: {{HOMEPAGE_VAR_PAPERLESS_USER}}
          password: {{HOMEPAGE_VAR_PAPERLESS_PASS}}

- Monitoring & Management:
    - Portainer:
        icon: portainer.png
        href: https://portainer.{{HOMEPAGE_VAR_DOMAIN}}
        description: Container Management
        widget:
          type: portainer
          url: http://portainer:9000
          env: 1
          key: {{HOMEPAGE_VAR_PORTAINER_KEY}}

    - Uptime Kuma:
        icon: uptime-kuma.png
        href: https://status.{{HOMEPAGE_VAR_DOMAIN}}
        description: Uptime Monitoring
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: default

    - Grafana:
        icon: grafana.png
        href: https://grafana.{{HOMEPAGE_VAR_DOMAIN}}
        description: Metrics Visualization
        widget:
          type: grafana
          url: http://grafana:3000
          username: {{HOMEPAGE_VAR_GRAFANA_USER}}
          password: {{HOMEPAGE_VAR_GRAFANA_PASS}}

    - Dozzle:
        icon: dozzle.png
        href: https://logs.{{HOMEPAGE_VAR_DOMAIN}}
        description: Container Logs

- Utilities:
    - IT-Tools:
        icon: it-tools.png
        href: https://tools.{{HOMEPAGE_VAR_DOMAIN}}
        description: Developer Utilities

    - Traefik:
        icon: traefik.png
        href: https://traefik.{{HOMEPAGE_VAR_DOMAIN}}
        description: Reverse Proxy
        widget:
          type: traefik
          url: http://traefik:8080
