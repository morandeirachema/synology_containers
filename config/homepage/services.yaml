---
# Homepage Dashboard Configuration
# Customize this file to show your services

- Security & Privacy:
    - Vaultwarden:
        icon: vaultwarden.png
        href: https://vault.{{HOMEPAGE_VAR_DOMAIN}}
        description: Password Manager
        widget:
          type: vaultwarden
          url: http://vaultwarden

    - Authelia:
        icon: authelia.png
        href: https://auth.{{HOMEPAGE_VAR_DOMAIN}}
        description: 2FA Authentication

    - Pi-hole:
        icon: pi-hole.png
        href: https://dns.{{HOMEPAGE_VAR_DOMAIN}}
        description: DNS & Ad Blocking
        widget:
          type: pihole
          url: http://pihole

    - WireGuard:
        icon: wireguard.png
        href: #
        description: VPN Server

- Productivity & Storage:
    - Nextcloud:
        icon: nextcloud.png
        href: https://cloud.{{HOMEPAGE_VAR_DOMAIN}}
        description: File Sync & Productivity

- Monitoring & Management:
    - Portainer:
        icon: portainer.png
        href: https://portainer.{{HOMEPAGE_VAR_DOMAIN}}
        description: Container Management
        widget:
          type: portainer
          url: http://portainer:9000
          env: 1
          key: {{HOMEPAGE_VAR_PORTAINER_KEY}}

    - Uptime Kuma:
        icon: uptime-kuma.png
        href: https://status.{{HOMEPAGE_VAR_DOMAIN}}
        description: Uptime Monitoring
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: default

    - Grafana:
        icon: grafana.png
        href: https://grafana.{{HOMEPAGE_VAR_DOMAIN}}
        description: Metrics Visualization
        widget:
          type: grafana
          url: http://grafana:3000
          username: {{HOMEPAGE_VAR_GRAFANA_USER}}
          password: {{HOMEPAGE_VAR_GRAFANA_PASS}}

    - Dozzle:
        icon: dozzle.png
        href: https://logs.{{HOMEPAGE_VAR_DOMAIN}}
        description: Container Logs

- Utilities:
    - IT-Tools:
        icon: it-tools.png
        href: https://tools.{{HOMEPAGE_VAR_DOMAIN}}
        description: Developer Utilities

    - Traefik:
        icon: traefik.png
        href: https://traefik.{{HOMEPAGE_VAR_DOMAIN}}
        description: Reverse Proxy
        widget:
          type: traefik
          url: http://traefik:8080
