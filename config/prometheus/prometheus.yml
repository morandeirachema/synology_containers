# Prometheus Configuration
# Metrics collection for all services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'synology-stack'
    environment: 'production'

# Alertmanager configuration (optional - configure if needed)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Traefik metrics
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
        labels:
          service: 'traefik'

  # cAdvisor for Docker container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'

  # Node exporter for system metrics (if added)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'node-exporter'

  # Home Assistant
  - job_name: 'homeassistant'
    metrics_path: '/api/prometheus'
    bearer_token: 'YOUR_HOME_ASSISTANT_TOKEN'  # Create long-lived token in HA
    scheme: http
    static_configs:
      - targets: ['homeassistant:8123']
        labels:
          service: 'homeassistant'

  # Authelia metrics
  - job_name: 'authelia'
    static_configs:
      - targets: ['authelia:9959']
        labels:
          service: 'authelia'
